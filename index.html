<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>you got mail</title>
<style>
:root{--sky:#cfe8ff;--blue:#4a90e2;--navy:#1f3b73;--paper:#fbfdff;--gold:#ffd966;--pale:#e8f3ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#16264a;--pale:#1d3260}}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{text-transform:lowercase;background-color:var(--sky);background-image:radial-gradient(#fff 2px,transparent 2.5px);background-size:26px 26px;font-family:-apple-system,'Segoe UI','Inter',Roboto,Helvetica,Arial,sans-serif;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:26px 16px;overflow-x:hidden}
.title{font-size:1.6rem;font-weight:700;letter-spacing:-.5px;color:var(--blue);text-shadow:2px 2px 0 #fff;margin:0 0 4px;text-align:center}
.sub{font-size:.95rem;font-weight:500;margin:0 0 22px;text-align:center}
.env{position:relative;width:min(310px,82vw);height:205px;cursor:pointer;transition:opacity .6s,transform .6s;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-2deg) translateY(-5px)}}
.env.open{animation:none}.env.gone{opacity:0;transform:translateY(40px);pointer-events:none;position:absolute}
.back{position:absolute;inset:0;background:var(--blue);border:3px solid var(--navy);border-radius:12px;box-shadow:6px 6px 0 var(--navy)}
.peek{position:absolute;left:14px;right:14px;top:14px;height:165px;background:var(--paper);border:3px solid var(--navy);border-radius:8px;transition:transform .9s .5s}
.env.open .peek{transform:translateY(-95px)}
.front{position:absolute;inset:0;background:#9cc9f5;border-radius:12px;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.flap{position:absolute;left:0;right:0;top:0;height:115px;background:#6fb0ee;transform-origin:top;clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .6s;z-index:3}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.seal{position:absolute;left:50%;top:84px;font-size:34px;color:#fff;z-index:4;transform:translateX(-50%);animation:beat 1.1s infinite}
.env.open .seal{opacity:0}
@keyframes beat{50%{transform:translateX(-50%) scale(1.25)}}
.tap{margin-top:22px;font-size:.95rem;font-weight:600;background:#fff;border:3px solid var(--navy);border-radius:20px;padding:3px 16px;box-shadow:3px 3px 0 var(--navy);transform:rotate(-2deg)}
#card{display:none;position:relative;width:min(440px,100%);background:var(--paper);border:3px solid var(--navy);border-radius:18px;box-shadow:8px 8px 0 var(--navy);padding:40px 22px 28px;color:var(--navy);margin:34px 0}
#card.show{display:block;animation:rise 1s both}
@keyframes rise{from{opacity:0;transform:translateY(90px) scale(.9)}to{opacity:1;transform:none}}
#card h2{font-size:1.5rem;font-weight:700;letter-spacing:-.5px;text-align:center;margin:0 0 18px;color:var(--blue)}
.cut{position:absolute;width:var(--s,44px);height:var(--s,44px);fill:var(--c,#fff);stroke:#fff;stroke-width:9;stroke-linejoin:round;paint-order:stroke fill;filter:drop-shadow(0 3px 0 rgba(31,59,115,.35));opacity:0;z-index:5}
.show .cut{animation:pop .65s var(--d,0s) both}
@keyframes pop{0%{opacity:0;transform:scale(0) rotate(-40deg)}65%{opacity:1;transform:scale(1.3) rotate(10deg)}100%{opacity:1;transform:scale(1) rotate(var(--r,0deg))}}
.pol{position:relative;width:80%;margin:0 auto 24px;background:#fff;border:3px solid var(--navy);padding:9px 9px 28px;box-shadow:4px 4px 0 var(--navy);transform:rotate(-2deg)}
.ph{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.empty{display:flex;align-items:center;justify-content:center;aspect-ratio:4/5;background:var(--pale);font-size:.9rem;color:var(--blue);font-weight:600}
.banner{position:absolute;left:50%;bottom:-14px;z-index:7;transform:translateX(-50%) rotate(-3deg);background:var(--blue);color:#fff;border:3px solid #fff;outline:3px solid var(--navy);border-radius:6px;padding:3px 18px;font-weight:700;font-size:1rem;white-space:nowrap;box-shadow:0 4px 0 var(--navy);opacity:0}
.show .banner{animation:pop2 .6s 1.3s both}
@keyframes pop2{0%{opacity:0;transform:translateX(-50%) scale(0) rotate(-10deg)}70%{opacity:1;transform:translateX(-50%) scale(1.2) rotate(-3deg)}100%{opacity:1;transform:translateX(-50%) scale(1) rotate(-3deg)}}
.stage{position:relative;width:78%;margin:34px auto 34px}
.burst{position:absolute;inset:6% -12% 2% -12%;background:#9cc9f5;border:3px solid var(--navy);border-radius:46% 54% 50% 50%/50% 46% 54% 50%;box-shadow:4px 4px 0 var(--navy);transform:rotate(-4deg)}
.sticker{position:relative;display:block;width:100%;height:auto;filter:drop-shadow(0 4px 0 rgba(31,59,115,.4));opacity:0;transform:scale(.4) rotate(-12deg)}
.show .sticker{animation:pops .8s .15s both}
@keyframes pops{0%{opacity:0;transform:scale(.4) rotate(-12deg)}70%{opacity:1;transform:scale(1.08) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(-2deg)}}
.letter{line-height:1.65;font-size:1rem}
.letter p{margin:0 0 14px}
.sign{text-align:right;color:var(--blue);font-weight:600}
</style>
</head>
